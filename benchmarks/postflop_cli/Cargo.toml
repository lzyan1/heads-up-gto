[package]
name = "postflop_cli"
version = "0.1.0"
edition = "2021"
description = "Reads one river spot as JSON on stdin, solves it with b-inary/postflop-solver (the engine of wasm-postflop), prints JSON lines."

[dependencies]
# AGPL-3.0 library, fetched at build time rather than vendored.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", default-features = false, features = ["rayon"] }
rayon = "1"
serde_json = "1"
