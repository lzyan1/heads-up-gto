[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heads-up-gto"
version = "0.3.0"
description = "Heads-up study with deterministic early streets and direct river equilibria"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "scipy>=1.11,<2"]

[project.scripts]
heads-up-gto = "heads_up_gto.server:main"

[tool.setuptools.package-data]
heads_up_gto = ["static/*"]

[tool.setuptools.packages.find]
include = ["heads_up_gto*"]
